name: ArgoCD Canary Deploy

on:
  push:
    branches: [main]
    paths:
      - "labs/lab01/**"
      - "gitops/lab01/overlays/staging-canary/**"
      - ".github/workflows/argocd-canary-deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: git sha)"
        required: false
        type: string

env:
  APP_DIR: labs/lab01
  ECR_REPOSITORY: iris-classifier
  GITOPS_OVERLAY: gitops/lab01/overlays/staging-canary
  ARGOCD_APP: lab01-iris-canary-staging
  ROLLOUT_NAME: iris-classifier
  ROLLOUT_NAMESPACE: mlops

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: python train.py
      - run: pytest tests/ -v

  build-push:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
      - working-directory: ${{ env.APP_DIR }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          pip install -r requirements.txt && python train.py
          docker build -t $REGISTRY/${{ env.ECR_REPOSITORY }}:$TAG .
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:$TAG

  update-gitops:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Kustomize image tag
        env:
          TAG: ${{ needs.build-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          cd ${{ env.GITOPS_OVERLAY }}
          if command -v kustomize &>/dev/null; then
            kustomize edit set image iris-classifier=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}
          else
            curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
            ./kustomize edit set image iris-classifier=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}
          fi
      - name: Commit GitOps change
        env:
          TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.GITOPS_OVERLAY }}/kustomization.yaml
          git diff --staged --quiet || git commit -m "deploy(canary): iris-classifier ${TAG}"
          git push

  argocd-sync:
    needs: update-gitops
    runs-on: ubuntu-latest
    if: vars.ARGOCD_SERVER != ''
    steps:
      - uses: actions/checkout@v4
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd && sudo mv argocd /usr/local/bin/
      - name: Sync ArgoCD Application
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app sync ${{ env.ARGOCD_APP }} --grpc-web
          argocd app wait ${{ env.ARGOCD_APP }} --health --timeout 600

  wait-rollout:
    needs: update-gitops
    runs-on: ubuntu-latest
    if: vars.EKS_CLUSTER_NAME != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }}
      - name: Install argo rollouts plugin
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts
      - name: Wait for rollout (canary steps)
        run: |
          kubectl argo rollouts status rollout/${{ env.ROLLOUT_NAME }} \
            -n ${{ env.ROLLOUT_NAMESPACE }} --timeout 15m || \
          echo "Rollout still in progress or cluster not reachable — check ArgoCD UI"
