name: ArgoCD Rollback Rollout

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Deployment strategy"
        required: true
        type: choice
        options:
          - canary
          - bluegreen
      namespace:
        default: mlops
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }}
      - name: Install kubectl-argo-rollouts
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts
      - name: Abort and undo rollout
        env:
          ROLLOUT: ${{ inputs.strategy == 'canary' && 'iris-classifier' || 'iris-classifier-bg' }}
          NS: ${{ inputs.namespace }}
        run: |
          kubectl argo rollouts abort rollout/$ROLLOUT -n $NS || true
          kubectl argo rollouts undo rollout/$ROLLOUT -n $NS
          kubectl argo rollouts status rollout/$ROLLOUT -n $NS --timeout 10m

      - name: Sync ArgoCD app
        if: vars.ARGOCD_SERVER != ''
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd && sudo mv argocd /usr/local/bin/
          APP=${{ inputs.strategy == 'canary' && 'lab01-iris-canary-staging' || 'lab01-iris-bluegreen-staging' }}
          argocd app sync $APP --grpc-web
