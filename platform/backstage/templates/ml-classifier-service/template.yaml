apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ml-classifier-service
  title: ML Classifier Service
  description: Tạo ML classification service mới (pattern Lab 1 — FastAPI + train + Docker + K8s + CI)
  tags:
    - ml
    - mlops
    - recommended
    - lab-01
spec:
  owner: group:mlops-team
  type: service
  parameters:
    - title: Service Information
      required:
        - name
        - owner
        - description
      properties:
        name:
          title: Service Name
          type: string
          description: Tên service (kebab-case, e.g. fraud-detector)
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
          description: Mô tả ngắn về model/service
        owner:
          title: Owner
          type: string
          description: GitHub username hoặc group
          default: mlops-team
    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch
      name: Fetch Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
