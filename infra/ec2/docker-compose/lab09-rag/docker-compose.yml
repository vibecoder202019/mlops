services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    ports:
      - "8081:8080"
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - meta-llama/Llama-3.2-1B-Instruct
      - --max-model-len
      - "2048"
      - --gpu-memory-utilization
      - "0.85"
    ports:
      - "8001:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.rag
    ports:
      - "8080:8080"
    environment:
      EMBEDDING_URL: http://embedding:8080
      LLM_URL: http://vllm:8000
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
      - embedding
      - vllm
    restart: unless-stopped

volumes:
  qdrant_data:
  huggingface_cache:
