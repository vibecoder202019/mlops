apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops

resources:
  - ../../base

nameSuffix: ""

commonLabels:
  deployment-strategy: canary

images:
  - name: iris-classifier
    newName: iris-classifier
    newTag: "1.0.0"

patches:
  - target:
      kind: Rollout
      name: iris-classifier
    patch: |
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - setWeight: 10
          - pause: { duration: 30s }
          - setWeight: 30
          - pause: { duration: 30s }
          - setWeight: 100
