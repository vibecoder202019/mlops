apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: iris-classifier-bg
  labels:
    app: iris-classifier
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: iris-classifier
  template:
    metadata:
      labels:
        app: iris-classifier
    spec:
      containers:
        - name: api
          image: iris-classifier:1.0.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  strategy:
    blueGreen:
      activeService: iris-classifier
      previewService: iris-classifier-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
          - templateName: iris-success-rate
      previewReplicaCount: 1
