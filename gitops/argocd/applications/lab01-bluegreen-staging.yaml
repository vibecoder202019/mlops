apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab01-iris-bluegreen-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: https://github.com/vibecoder202019/mlops.git
    targetRevision: main
    path: gitops/lab01/overlays/staging-bluegreen
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
