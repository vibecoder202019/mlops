# Inventory file — danh sách máy chủ cho Ansible
# Format INI — đơn giản nhất cho người mới

# [tên_nhóm] — định nghĩa nhóm host
[local]
# localhost — chạy trên chính máy đang thực thi Ansible
localhost ansible_connection=local

# [tên_nhóm:vars] — biến áp dụng cho toàn nhóm
[local:vars]
# ansible_python_interpreter — chỉ định Python dùng trên target host
ansible_python_interpreter=/usr/bin/python3
