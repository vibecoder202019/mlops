---
# Playbook 3 — Python + MinIO: tạo report và upload S3
# Yêu cầu: boto3 trong Execution Environment (xem execution-environment.yml)
# Job Template: "Python MinIO Demo"

- name: Python generate report và upload MinIO
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    # DNS nội bộ K8s — AWX task pod gọi trực tiếp MinIO
    minio_endpoint: "http://minio.minio.svc.cluster.local:9000"
    minio_bucket: "awx-artifacts"

  tasks:
    - name: "[1/3] Chạy Python tạo file report"
      script: ../../python/scripts/generate_report.py
      register: report_task

    - name: Lấy đường dẫn file report
      set_fact:
        report_file: "{{ report_task.stdout | trim }}"

    - name: "Report file: {{ report_file }}"
      debug:
        msg: "File report: {{ report_file }}"

    - name: "[2/3] Upload report lên MinIO bằng Python/boto3"
      script: ../../python/scripts/upload_to_minio.py
      environment:
        MINIO_ENDPOINT: "{{ minio_endpoint }}"
        MINIO_ACCESS_KEY: minioadmin
        MINIO_SECRET_KEY: minioadmin123
        MINIO_BUCKET: "{{ minio_bucket }}"
        REPORT_FILE: "{{ report_file }}"
      register: upload_result

    - name: "[3/3] Kết quả upload"
      debug:
        msg: "{{ upload_result.stdout }}"

    - name: Tóm tắt job
      debug:
        msg:
          - "✅ Python report đã upload lên MinIO"
          - "Bucket: {{ minio_bucket }}"
          - "Kiểm tra: mc ls local/{{ minio_bucket }}/reports/"
