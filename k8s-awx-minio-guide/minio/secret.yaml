# Secret lưu root credential MinIO
# ⚠️ CHỈ DÙNG CHO HỌC TẬP — production: dùng Sealed Secrets hoặc External Secrets Operator
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: minio
  labels:
    app: minio
type: Opaque
stringData:
  # rootUser — tương đương AWS Access Key ID
  rootUser: minioadmin
  # rootPassword — tương đương AWS Secret Access Key
  rootPassword: minioadmin123
