# Ingress — route HTTP từ bên ngoài vào MinIO
# Yêu cầu: NGINX Ingress Controller đã cài (xem docs/01)
# Yêu cầu: thêm minio.local và minio-api.local vào /etc/hosts
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  namespace: minio
  annotations:
    # Tăng body size — upload file lớn qua Console
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    # Console UI — giao diện quản lý bucket
    - host: minio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
    # S3 API — dùng cho mc CLI, AWX, boto3
    - host: minio-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
