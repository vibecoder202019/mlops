apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: iris-classifier
  namespace: mlops
spec:
  host: iris-classifier
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        idleTimeout: 60s
  subsets:
    - name: v1
      labels:
        version: v1.0.0
    - name: v2
      labels:
        version: v2.0.0
