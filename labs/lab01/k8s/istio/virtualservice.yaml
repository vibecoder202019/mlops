apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: iris-classifier
  namespace: mlops
spec:
  hosts:
    - iris.lab.local
  gateways:
    - iris-gateway
  http:
    - match:
        - uri:
            prefix: /health
        - uri:
            prefix: /metadata
        - uri:
            prefix: /predict
        - uri:
            prefix: /docs
        - uri:
            prefix: /openapi.json
      route:
        - destination:
            host: iris-classifier
            port:
              number: 8000
            subset: v1
          weight: 100
      timeout: 30s
      retries:
        attempts: 2
        perTryTimeout: 10s
        retryOn: 5xx,reset,connect-failure
